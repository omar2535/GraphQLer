[project]
site_name = "GraphQLer"
site_url = "https://omar2535.github.io/GraphQLer/"
site_description = "The dependency-aware GraphQL API security testing tool"
site_author = "Omar Tsai"
copyright = "Copyright &copy; Omar Tsai &mdash; MIT License"

repo_url = "https://github.com/omar2535/GraphQLer"
repo_name = "omar2535/GraphQLer"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"

# Pages that embed repository files via snippets must rebuild when those files change
watch = ["graphqler/examples/config.toml"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
  ] },
  { "Usage" = [
    { "Modes" = "modes.md" },
    { "Interactive TUI" = "tui.md" },
    { "CLI reference" = "cli.md" },
    { "Configuration" = "configuration.md" },
    { "Output files" = "output.md" },
  ] },
  { "Features" = [
    { "Vulnerability detection" = "detectors.md" },
    { "IDOR & UAF chains" = "idor.md" },
    { "LLM features" = "llm.md" },
    { "MCP server" = "mcp.md" },
  ] },
  { "Extending" = [
    { "Plugins" = "plugins.md" },
    { "Python API" = "python-api.md" },
  ] },
  { "Development" = [
    { "Architecture" = "architecture.md" },
    { "Contributing" = "CONTRIBUTING.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/bug"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/omar2535/GraphQLer"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/GraphQLer/"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/omar2535/graphqler"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
